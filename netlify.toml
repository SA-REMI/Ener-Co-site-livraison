# ============================================================================
# Ener-Co · Configuration Netlify
# Site statique : aucun build, on publie directement les fichiers du depot.
# Chaque modification validee dans /admin ecrit dans Git, ce qui declenche
# automatiquement un nouveau deploiement Netlify.
# ============================================================================

[build]
  # Pas d'etape de build (site HTML statique pur)
  publish = "."
  command = ""

# En-tetes de securite (equivalents du .htaccess OVH)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Les fichiers de contenu JSON ne sont pas mis en cache agressif
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ATTENTION · force = true est INDISPENSABLE sur toutes les regles qui bloquent
# un fichier EXISTANT. Sur Netlify, un fichier present dans le dossier publie
# l'emporte sur une redirection : sans force, la regle est ecrite, deployee, et
# ne s'applique jamais. Les fichiers ci-dessous etaient servis en clair malgre
# leurs regles, constate le 22 octobre 2026.
#
# Le piege se double d'un piege de recette : tester "/legacy/n-importe-quoi"
# renvoie bien 404, parce que ce chemin n'existe pas. Seul le VRAI chemin du
# fichier teste la regle. Voir outils/verif-exposition.js.

# Le dossier legacy (ancien contact.php conserve pour archive) n'est pas servi.
# Netlify n'execute pas le PHP : sans cette regle le code source serait visible.
[[redirects]]
  from = "/legacy/*"
  to = "/404.html"
  status = 404
  force = true

# Les outils de generation ne sont pas des pages.
[[redirects]]
  from = "/outils/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/build-langues.js"
  to = "/404.html"
  status = 404
  force = true

# Documents de travail internes, versionnes mais non publies.
[[redirects]]
  from = "/GUIDE-REPRISE-TECHNIQUE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/BRIEF-INTEGRATION.md"
  to = "/404.html"
  status = 404
  force = true

# Les anciennes URL du traitement PHP redirigent vers la page contact
[[redirects]]
  from = "/contact.php"
  to = "/contact.html"
  status = 301

# La documentation interne (docs/) n'est pas publiee : le guide de la console
# est diffuse en PDF, avec les identifiants, sur le serveur interne uniquement.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

# L'ancienne adresse publique du guide ne repond plus.
[[redirects]]
  from = "/GUIDE-CONSOLE.html"
  to = "/404.html"
  status = 404

# ============================================================================
# ANCIEN SITE WORDPRESS · redirections permanentes (301)
# Les 10 adresses connues de Google au 12/10/2026, relevees dans le sitemap
# de l'ancien site. Une 301 transfere le credit de referencement acquis vers
# la nouvelle page : sans elles, Google voit des erreurs et dereference.
# A conserver plusieurs annees : des liens externes pointent encore dessus.
# ============================================================================

# Correspondances directes
[[redirects]]
  from = "/contact/"
  to = "/contact.html"
  status = 301
[[redirects]]
  from = "/mentions-legales/"
  to = "/mentions-legales.html"
  status = 301
[[redirects]]
  from = "/politique-de-confidentialite/"
  to = "/politique-de-confidentialite.html"
  status = 301

# Gaines a barres : devenu l'un des six domaines de la page Expertise
[[redirects]]
  from = "/gaines-a-barres/"
  to = "/expertise.html"
  status = 301

# Nos clients : devenu la page References
[[redirects]]
  from = "/nos-clients/"
  to = "/references.html"
  status = 301

# Activites de l'ancienne societe (REMI Transfert / REMI Genie Electromecanique)
# qui ne figurent pas au catalogue Ener-Co actuel. Redirigees vers l'accueil,
# qui presente le perimetre reel. A reorienter si l'une redevient d'actualite.
[[redirects]]
  from = "/transfert-industriel/"
  to = "/"
  status = 301
[[redirects]]
  from = "/pupitres-simulateurs/"
  to = "/"
  status = 301
[[redirects]]
  from = "/panneaux-photovoltaiques/"
  to = "/"
  status = 301

# Article de demonstration WordPress, sans contenu utile
[[redirects]]
  from = "/2020/10/25/bonjour-tout-le-monde/"
  to = "/"
  status = 301

# Anciens plans de site WordPress
[[redirects]]
  from = "/wp-sitemap.xml"
  to = "/sitemap.xml"
  status = 301
[[redirects]]
  from = "/wp-sitemap-posts-page-1.xml"
  to = "/sitemap.xml"
  status = 301
[[redirects]]
  from = "/wp-sitemap-posts-post-1.xml"
  to = "/sitemap.xml"
  status = 301

# Les chemins d'administration WordPress n'existent plus
[[redirects]]
  from = "/wp-admin/*"
  to = "/404.html"
  status = 404
[[redirects]]
  from = "/wp-login.php"
  to = "/404.html"
  status = 404
