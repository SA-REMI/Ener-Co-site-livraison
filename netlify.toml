# ============================================================================
# Ener-Co · Configuration Netlify
# Site statique : aucun build, on publie directement les fichiers du depot.
# Chaque modification validee dans /admin ecrit dans Git, ce qui declenche
# automatiquement un nouveau deploiement Netlify.
# ============================================================================

[build]
  # Pas d'etape de build (site HTML statique pur)
  publish = "."
  command = ""

# En-tetes de securite (equivalents du .htaccess OVH)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Les fichiers de contenu JSON ne sont pas mis en cache agressif
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Le dossier legacy (ancien contact.php conserve pour archive) n'est pas servi.
# Netlify n'execute pas le PHP : sans cette regle le code source serait visible.
[[redirects]]
  from = "/legacy/*"
  to = "/404.html"
  status = 404

# Les anciennes URL du traitement PHP redirigent vers la page contact
[[redirects]]
  from = "/contact.php"
  to = "/contact.html"
  status = 301
