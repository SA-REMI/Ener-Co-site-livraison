# ============================================================================
# Ener-Co · Configuration de l'espace d'edition (Decap CMS)
# Chaque "collection" = un type de contenu editable.
# Les editeurs ne voient QUE ce qui est declare ici · le design et la
# structure des pages restent intouchables.
#
# Les textes sont stockes dans /content/textes/*.json (un fichier par page).
# Le site lit ces fichiers au chargement et applique leurs valeurs par-dessus
# les textes d'origine. Un texte laisse vide reprend automatiquement sa
# valeur d'origine · on ne peut donc jamais "vider" le site par accident.
# ============================================================================

backend:
  name: git-gateway
  branch: main
  # Authentification par email + mot de passe via Netlify Identity.
  # Git Gateway ecrit les modifications dans le depot a la place de l'editeur,
  # qui n'a donc pas besoin de compte GitHub.

# Dossier ou sont televersees les images depuis le CMS
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# Langue de l'interface d'edition
locale: "fr"

# Modele de champ reutilise pour chaque page de textes (FR / EN / IT).
# YAML "ancre" : defini une fois ici, reutilise via <<: *champs_texte plus bas.
_champs_texte: &champs_texte
  - name: "textes"
    label: "Textes de la page"
    label_singular: "Texte"
    widget: "list"
    collapsed: true
    summary: "{{fields.fr}}"
    fields:
      - { name: "fr", label: "Français", widget: "text" }
      - { name: "en", label: "Anglais", widget: "text" }
      - { name: "it", label: "Italien", widget: "text" }
      # Reference technique du texte · ne pas modifier, sert au site a savoir
      # quel texte remplacer. Masquee a l'editeur.
      - { name: "cle", label: "Référence technique", widget: "hidden" }

collections:

  # ------------------------------------------------------------------------
  # PAGES DE TEXTES (un fichier par page, 3 langues)
  # ------------------------------------------------------------------------
  - name: "txt_accueil"
    label: "Accueil · textes"
    delete: false
    files:
      - name: "textes"
        label: "Textes de la page d'accueil"
        file: "content/textes/accueil.json"
        description: "Tous les textes de la page d'accueil. Cliquez un texte pour le déplier et modifier le français, l'anglais et l'italien."
        fields: *champs_texte

  - name: "txt_expertise"
    label: "Expertise · textes"
    delete: false
    files:
      - name: "textes"
        label: "Textes de la page Expertise"
        file: "content/textes/expertise.json"
        description: "Tous les textes de la page Expertise, dans les trois langues."
        fields: *champs_texte

  - name: "txt_realisations"
    label: "Réalisations · textes"
    delete: false
    files:
      - name: "textes"
        label: "Textes de la page Réalisations"
        file: "content/textes/realisations.json"
        description: "Tous les textes de la page Réalisations, dans les trois langues."
        fields: *champs_texte

  - name: "txt_secteurs"
    label: "Secteurs · textes"
    delete: false
    files:
      - name: "textes"
        label: "Textes de la page Secteurs"
        file: "content/textes/secteurs.json"
        description: "Tous les textes de la page Secteurs, dans les trois langues."
        fields: *champs_texte

  - name: "txt_engagements"
    label: "Engagements · textes"
    delete: false
    files:
      - name: "textes"
        label: "Textes de la page Engagements"
        file: "content/textes/engagements.json"
        description: "Tous les textes de la page Engagements, dans les trois langues."
        fields: *champs_texte

  - name: "txt_recrutement"
    label: "Recrutement · textes"
    delete: false
    files:
      - name: "textes"
        label: "Textes de la page Recrutement"
        file: "content/textes/recrutement.json"
        description: "Tous les textes de la page Recrutement, dans les trois langues."
        fields: *champs_texte

  - name: "txt_references"
    label: "Références · textes"
    delete: false
    files:
      - name: "textes"
        label: "Textes de la page Références"
        file: "content/textes/references.json"
        description: "Tous les textes de la page Références (hors logos), dans les trois langues."
        fields: *champs_texte

  - name: "txt_contact"
    label: "Contact · textes"
    delete: false
    files:
      - name: "textes"
        label: "Textes de la page Contact"
        file: "content/textes/contact.json"
        description: "Tous les textes de la page Contact, dans les trois langues."
        fields: *champs_texte

  - name: "txt_commun"
    label: "Commun (menu, pied de page)"
    delete: false
    files:
      - name: "textes"
        label: "Textes communs à toutes les pages"
        file: "content/textes/commun.json"
        description: "Menu de navigation, pied de page et messages d'erreur · ces textes apparaissent sur toutes les pages."
        fields: *champs_texte

  - name: "txt_merci"
    label: "Page « merci » · textes"
    delete: false
    files:
      - name: "textes"
        label: "Textes de la page de confirmation"
        file: "content/textes/merci.json"
        description: "La page affichée après l'envoi du formulaire de contact, dans les trois langues."
        fields: *champs_texte

  - name: "txt_legal"
    label: "Mentions légales · textes"
    delete: false
    files:
      - name: "textes"
        label: "Textes des mentions légales"
        file: "content/textes/legal.json"
        description: "Page en français. Les cases Anglais et Italien contiennent le même texte français : traduisez-les si vous le souhaitez. Certains blocs contiennent des balises comme <strong> ou <br> : gardez-les telles quelles."
        fields: *champs_texte

  - name: "txt_privacy"
    label: "Politique de confidentialité · textes"
    delete: false
    files:
      - name: "textes"
        label: "Textes de la politique de confidentialité"
        file: "content/textes/privacy.json"
        description: "Page en français. Les cases Anglais et Italien contiennent le même texte français : traduisez-les si vous le souhaitez. Certains blocs contiennent des balises comme <strong> ou <a> : gardez-les telles quelles."
        fields: *champs_texte

  # ------------------------------------------------------------------------
  # COORDONNEES · telephone, email, adresse (en-tete, pied de page, bandeaux)
  # Un seul endroit, applique sur toutes les pages au chargement.
  # ------------------------------------------------------------------------
  - name: "coordonnees"
    label: "Coordonnées (téléphone, email, adresse)"
    delete: false
    files:
      - name: "coordonnees"
        label: "Coordonnées de la société"
        file: "content/coordonnees.json"
        description: "Le téléphone, l'email et l'adresse affichés dans l'en-tête, le pied de page et les bandeaux de contact de toutes les pages. Une modification ici se répercute partout."
        fields:
          - { name: "societe", label: "Raison sociale", widget: "string", hint: "ex : Ener-Co SAS" }
          - { name: "telephone", label: "Téléphone (tel qu'affiché)", widget: "string", hint: "ex : +33 (0)4 26 07 67 79" }
          - { name: "telephone_lien", label: "Téléphone (format lien, sans espaces)", widget: "string", hint: "ex : +33426076779. Sert au clic-pour-appeler sur mobile." }
          - { name: "email", label: "Adresse email", widget: "string", hint: "ex : contact@ener-co.fr" }
          - { name: "adresse_rue", label: "Adresse · rue", widget: "string", hint: "ex : 11 rue Sigmund Freud" }
          - { name: "adresse_ville", label: "Adresse · code postal et ville", widget: "string", hint: "ex : 69120 Vaulx-en-Velin · France" }

  # ------------------------------------------------------------------------
  # PHOTOS DES REALISATIONS · 4 photos par cas
  # La photo d'origine reste tant qu'on n'en choisit pas une autre.
  # ------------------------------------------------------------------------
  - name: "photos_realisations"
    label: "Réalisations · photos"
    delete: false
    files:
      - name: "cas"
        label: "Photos de chaque réalisation"
        file: "content/realisations-photos.json"
        description: "Les 4 photos de chaque cas de la page Réalisations. Cliquez un cas pour le déplier et remplacer une photo. Formats jpg ou png, 1600 px de large maximum conseillé."
        fields:
          - name: "cas"
            label: "Réalisations"
            label_singular: "Réalisation"
            widget: "list"
            collapsed: true
            allow_add: false
            summary: "{{fields.intitule}}"
            fields:
              - { name: "intitule", label: "Réalisation", widget: "string", hint: "Repère seulement : le titre affiché sur le site se modifie dans « Réalisations · textes »." }
              - { name: "photo1", label: "Photo 1", widget: "image", media_folder: "/assets/images/realisations", public_folder: "/assets/images/realisations" }
              - { name: "photo2", label: "Photo 2", widget: "image", media_folder: "/assets/images/realisations", public_folder: "/assets/images/realisations" }
              - { name: "photo3", label: "Photo 3", widget: "image", media_folder: "/assets/images/realisations", public_folder: "/assets/images/realisations" }
              - { name: "photo4", label: "Photo 4", widget: "image", media_folder: "/assets/images/realisations", public_folder: "/assets/images/realisations" }
              - { name: "cle", label: "Référence technique", widget: "hidden" }

  # ------------------------------------------------------------------------
  # REFERENCES CLIENTS · logos (liste d'images)
  # ------------------------------------------------------------------------
  - name: "references"
    label: "Références · logos clients"
    delete: false
    files:
      - name: "clients"
        label: "Liste des clients / partenaires"
        file: "content/references.json"
        description: "Les logos affichés dans le bandeau défilant de l'accueil et sur la page Références. Ajoutez ou retirez un client ici."
        fields:
          - name: "clients"
            label: "Clients"
            label_singular: "Client"
            widget: "list"
            collapsed: true
            summary: "{{fields.nom}}"
            fields:
              - { name: "nom", label: "Nom du client", widget: "string", hint: "Le nom de l'entreprise (sert aussi de texte alternatif pour le logo)." }
              - { name: "logo", label: "Logo", widget: "image", media_folder: "/assets/logos", public_folder: "/assets/logos", hint: "Téléversez le logo (PNG transparent de préférence)." }
              - name: "format"
                label: "Format du logo"
                widget: "select"
                options: ["paysage", "carré", "très allongé"]
                default: "paysage"
                hint: "Aide à bien cadrer le logo dans sa case."
