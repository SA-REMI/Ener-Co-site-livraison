# ============================================================================
# Ener-Co · Configuration de l'espace d'edition (Decap CMS)
# Chaque "collection" = un type de contenu editable.
# Les editeurs ne voient QUE ce qui est declare ici · le design et la
# structure des pages restent intouchables.
#
# Les textes sont stockes dans /content/textes/*.json (un fichier par page).
# Le site lit ces fichiers au chargement et applique leurs valeurs par-dessus
# les textes d'origine. Un texte laisse vide reprend automatiquement sa
# valeur d'origine · on ne peut donc jamais "vider" le site par accident.
# ============================================================================

backend:
  name: git-gateway
  branch: main
  # Authentification par email + mot de passe via Netlify Identity.
  # Git Gateway ecrit les modifications dans le depot a la place de l'editeur,
  # qui n'a donc pas besoin de compte GitHub.

# Dossier ou sont televersees les images depuis le CMS
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# Langue de l'interface d'edition
locale: "fr"

# Modele de champ reutilise pour chaque page de textes (FR / EN / IT).
# YAML "ancre" : defini une fois ici, reutilise via <<: *champs_texte plus bas.
_champs_texte: &champs_texte
  - name: "textes"
    label: "Textes de la page"
    label_singular: "Texte"
    widget: "list"
    collapsed: true
    summary: "{{fields.fr}}"
    fields:
      - { name: "fr", label: "Français", widget: "text" }
      - { name: "en", label: "Anglais", widget: "text" }
      - { name: "it", label: "Italien", widget: "text" }
      # Reference technique du texte · ne pas modifier, sert au site a savoir
      # quel texte remplacer. Masquee a l'editeur.
      - { name: "cle", label: "Référence technique", widget: "hidden" }

collections:

  # ------------------------------------------------------------------------
  # PAGES DE TEXTES (un fichier par page, 3 langues)
  # ------------------------------------------------------------------------
  - name: "txt_accueil"
    label: "Accueil · textes"
    delete: false
    files:
      - name: "textes"
        label: "Textes de la page d'accueil"
        file: "content/textes/accueil.json"
        description: "Tous les textes de la page d'accueil. Cliquez un texte pour le déplier et modifier le français, l'anglais et l'italien."
        fields: *champs_texte

  - name: "txt_expertise"
    label: "Expertise · textes"
    delete: false
    files:
      - name: "textes"
        label: "Textes de la page Expertise"
        file: "content/textes/expertise.json"
        description: "Tous les textes de la page Expertise, dans les trois langues."
        fields: *champs_texte

  - name: "txt_realisations"
    label: "Réalisations · textes"
    delete: false
    files:
      - name: "textes"
        label: "Textes de la page Réalisations"
        file: "content/textes/realisations.json"
        description: "Tous les textes de la page Réalisations, dans les trois langues."
        fields: *champs_texte

  - name: "txt_secteurs"
    label: "Secteurs · textes"
    delete: false
    files:
      - name: "textes"
        label: "Textes de la page Secteurs"
        file: "content/textes/secteurs.json"
        description: "Tous les textes de la page Secteurs, dans les trois langues."
        fields: *champs_texte

  - name: "txt_engagements"
    label: "Engagements · textes"
    delete: false
    files:
      - name: "textes"
        label: "Textes de la page Engagements"
        file: "content/textes/engagements.json"
        description: "Tous les textes de la page Engagements, dans les trois langues."
        fields: *champs_texte

  - name: "txt_recrutement"
    label: "Recrutement · textes"
    delete: false
    files:
      - name: "textes"
        label: "Textes de la page Recrutement"
        file: "content/textes/recrutement.json"
        description: "Tous les textes de la page Recrutement, dans les trois langues."
        fields: *champs_texte

  - name: "txt_references"
    label: "Références · textes"
    delete: false
    files:
      - name: "textes"
        label: "Textes de la page Références"
        file: "content/textes/references.json"
        description: "Tous les textes de la page Références (hors logos), dans les trois langues."
        fields: *champs_texte

  - name: "txt_contact"
    label: "Contact · textes"
    delete: false
    files:
      - name: "textes"
        label: "Textes de la page Contact"
        file: "content/textes/contact.json"
        description: "Tous les textes de la page Contact, dans les trois langues."
        fields: *champs_texte

  - name: "txt_commun"
    label: "Commun (menu, pied de page)"
    delete: false
    files:
      - name: "textes"
        label: "Textes communs à toutes les pages"
        file: "content/textes/commun.json"
        description: "Menu de navigation, pied de page et messages d'erreur · ces textes apparaissent sur toutes les pages."
        fields: *champs_texte

  # ------------------------------------------------------------------------
  # REFERENCES CLIENTS · logos (liste d'images)
  # ------------------------------------------------------------------------
  - name: "references"
    label: "Références · logos clients"
    delete: false
    files:
      - name: "clients"
        label: "Liste des clients / partenaires"
        file: "content/references.json"
        description: "Les logos affichés dans le bandeau défilant de l'accueil et sur la page Références. Ajoutez ou retirez un client ici."
        fields:
          - name: "clients"
            label: "Clients"
            label_singular: "Client"
            widget: "list"
            collapsed: true
            summary: "{{fields.nom}}"
            fields:
              - { name: "nom", label: "Nom du client", widget: "string", hint: "Le nom de l'entreprise (sert aussi de texte alternatif pour le logo)." }
              - { name: "logo", label: "Logo", widget: "image", media_folder: "/assets/logos", public_folder: "/assets/logos", hint: "Téléversez le logo (PNG transparent de préférence)." }
              - name: "format"
                label: "Format du logo"
                widget: "select"
                options: ["paysage", "carré", "très allongé"]
                default: "paysage"
                hint: "Aide à bien cadrer le logo dans sa case."
